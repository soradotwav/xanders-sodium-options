name: Build JARs

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      artifact-name:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Test release tooling
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Set up Java 21 and 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The last version runs Gradle; Java 21 remains available as a toolchain.
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and build all targets
        run: |
          ./gradlew --no-daemon --console=plain \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            spotlessCheck buildRelease

      - name: Upload distributable JARs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name || format('xanders-sodium-options-{0}', github.sha) }}
          # Collection tasks select the distributable JAR, excluding dev/source JARs.
          path: |
            build/libs/**/*.jar
            build/libs/release-artifacts.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
