name: Maintain release selectors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xso-publishing
  cancel-in-progress: false

jobs:
  selectors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Keep fix, minor and major available in the release form
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release.py selectors
